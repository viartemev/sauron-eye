<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sauron Eye — Call Graph Visualizer</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:       #0d1117;
      --surface:  #161b22;
      --surface2: #1f2937;
      --border:   #30363d;
      --text:     #e6edf3;
      --muted:    #8b949e;
      --dim:      #484f58;
      --handler:    #7c3aed;
      --service:    #1d4ed8;
      --repository: #047857;
      --http_client:#b45309;
      --producer:   #b91c1c;
      --unknown:    #374151;
      /* theme-sensitive */
      --dot-color:     #1e293b;
      --node-text:     #e6edf3;
      --node-dim-text: #484f58;
      --link-color:    #21262d;
      --source-bg:     #010409;
      --source-text:   #c9d1d9;
      --ep-active-bg:  #0d2044;
      --overlay-bg:    rgba(22,27,34,.92);
    }
    [data-theme="light"] {
      --bg:       #f6f8fa;
      --surface:  #ffffff;
      --surface2: #f0f2f5;
      --border:   #d0d7de;
      --text:     #24292f;
      --muted:    #57606a;
      --dim:      #8c959f;
      /* light: keep category colors — they work on both themes */
      --dot-color:     #dde1e6;
      --node-text:     #24292f;
      --node-dim-text: #8c959f;
      --link-color:    #c8d0d8;
      --source-bg:     #f6f8fa;
      --source-text:   #24292f;
      --ep-active-bg:  #dbeafe;
      --overlay-bg:    rgba(255,255,255,.92);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      height: 100vh; overflow: hidden;
      display: flex; flex-direction: column;
    }

    /* ── TOPBAR ── */
    #topbar {
      height: 46px; background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
      padding: 0 16px; gap: 12px; flex-shrink: 0;
    }
    .logo { font-weight: 700; font-size: 14px; color: #a78bfa; letter-spacing: -0.3px; display: flex; align-items: center; gap: 8px; }
    .logo span { color: var(--muted); font-weight: 400; font-size: 13px; }
    .logo-img { height: 26px; width: auto; display: block; }
    .btn-back {
      background: none; border: none; color: var(--muted);
      font-size: 18px; line-height: 1; cursor: pointer; padding: 2px 6px;
      border-radius: 5px; transition: color .12s, background .12s;
      display: flex; align-items: center;
    }
    .btn-back:hover { color: var(--text); background: var(--surface2); }
    .chip {
      display: flex; align-items: center; gap: 5px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 5px; padding: 2px 8px; font-size: 11px; color: var(--muted);
    }
    .chip b { color: var(--text); }
    .chip.warn { border-color: #b45309; color: #f59e0b; }
    .chip.warn b { color: #f59e0b; }
    .chip.err  { border-color: #7f1d1d; color: #f87171; }
    .chip.err b  { color: #f87171; }
    #topbar-spacer { flex: 1; }
    .btn-sm {
      background: none; border: 1px solid var(--border);
      color: var(--muted); padding: 4px 12px; border-radius: 5px;
      cursor: pointer; font-size: 11px; transition: border-color .12s, color .12s;
    }
    .btn-sm:hover { border-color: var(--muted); color: var(--text); }

    /* ── MAIN LAYOUT ── */
    #layout { display: flex; flex: 1; overflow: hidden; }

    /* ── SIDEBAR ── */
    #sidebar {
      width: 252px; background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow: hidden; flex-shrink: 0;
    }
    #sidebar-title {
      padding: 10px 14px; font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .8px;
      color: var(--dim); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .sidebar-toggle-btn {
      background: none; border: 1px solid var(--border);
      color: var(--dim); border-radius: 4px; padding: 2px 7px;
      font-size: 10px; cursor: pointer; text-transform: none;
      letter-spacing: 0; font-weight: 500; transition: border-color .12s, color .12s;
    }
    .sidebar-toggle-btn:hover { border-color: var(--muted); color: var(--muted); }
    .sidebar-toggle-btn.active { border-color: #7c3aed; color: #a78bfa; background: rgba(124,58,237,.1); }

    /* Search box */
    #ep-search-wrap {
      padding: 6px 10px; border-bottom: 1px solid var(--border);
      background: var(--surface); flex-shrink: 0;
    }
    #ep-search {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 5px; padding: 5px 9px; color: var(--text); font-size: 11px;
      outline: none; transition: border-color .12s;
    }
    #ep-search:focus { border-color: #7c3aed; }
    #ep-search::placeholder { color: var(--dim); }

    #pkg-filter-wrap {
      display: flex; align-items: center; gap: 6px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 5px; padding: 2px 8px; font-size: 11px;
    }
    #pkg-filter-wrap label { color: var(--dim); white-space: nowrap; }
    #pkg-filter-input {
      background: none; border: none; outline: none;
      color: var(--text); font-size: 11px; font-family: 'SF Mono','Fira Code',monospace;
      width: 240px;
    }
    #pkg-filter-input::placeholder { color: var(--dim); }
    #ep-list.hide-stdlib .ep-item.stdlib { display: none; }
    #ep-list.hide-stdlib .group-label.stdlib-only { display: none; }
    #ep-list { flex: 1; overflow-y: auto; padding: 6px; }
    .group-label {
      padding: 8px 8px 3px; font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .6px; color: var(--dim);
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; user-select: none;
    }
    .group-label:hover { color: var(--muted); }
    .group-arrow { font-size: 10px; transition: transform .15s; flex-shrink: 0; }
    .group-label.grp-collapsed .group-arrow { transform: rotate(-90deg); }
    .group-items.grp-collapsed { display: none; }
    .ep-item {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 7px 9px; border-radius: 6px; cursor: pointer;
      margin-bottom: 1px; border: 1px solid transparent;
      transition: background .1s;
    }
    .ep-item:hover { background: var(--surface2); }
    .ep-item.active { background: var(--ep-active-bg); border-color: #1d4ed8; }
    .ep-item.hidden { display: none; }
    .ep-icon { font-size: 13px; margin-top: 2px; flex-shrink: 0; }
    .ep-info { min-width: 0; flex: 1; }
    .ep-top  { display: flex; align-items: center; gap: 5px; margin-bottom: 1px; }
    .ep-method {
      font-size: 10px; font-weight: 700; flex-shrink: 0;
    }
    /* HTTP method colors */
    .m-GET     { color: #22c55e; }
    .m-POST    { color: #3b82f6; }
    .m-PUT     { color: #f59e0b; }
    .m-DELETE  { color: #ef4444; }
    .m-PATCH   { color: #a855f7; }
    .m-HEAD    { color: #8b949e; }
    .m-OPTIONS { color: #8b949e; }
    .m-ANY     { color: #60a5fa; }
    .m-other   { color: #60a5fa; }
    /* Framework badge */
    .fw-badge {
      font-size: 9px; font-weight: 600; padding: 1px 5px; border-radius: 3px;
      background: rgba(124,58,237,.15); color: #a78bfa;
      border: 1px solid rgba(124,58,237,.25); flex-shrink: 0;
    }
    .fw-badge.fw-grpc  { background: rgba(14,165,233,.15); color: #7dd3fc; border-color: rgba(14,165,233,.25); }
    .fw-badge.fw-kafka { background: rgba(185,28,28,.15); color: #f87171; border-color: rgba(185,28,28,.25); }
    .fw-badge.fw-stdlib{ background: rgba(75,85,99,.2);   color: #9ca3af; border-color: rgba(75,85,99,.3); }
    .ep-path { font-size: 12px; font-family: 'SF Mono','Fira Code',monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ep-fn { font-size: 10px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ep-item.stdlib .ep-path { color: var(--dim); }

    /* ── TREE AREA ── */
    #tree-area {
      flex: 1; position: relative; overflow: hidden;
      background: var(--bg);
      background-image: radial-gradient(circle at 1px 1px, var(--dot-color) 1px, transparent 0);
      background-size: 28px 28px;
    }
    #tree-svg { width: 100%; height: 100%; }
    .link          { fill: none; stroke: var(--link-color); stroke-width: 2; }
    .link-channel  { stroke: #7c3aed; stroke-width: 1.5; stroke-dasharray: 7,3; opacity: .75; }
    .link-deferred { stroke: #d97706; stroke-width: 1.5; stroke-dasharray: 3,3; opacity: .7; }
    .node-g { cursor: pointer; }
    .node-g.selected .node-bg { stroke: #f0f6fc !important; stroke-width: 2px !important; }
    .node-g:hover .node-bg { filter: brightness(1.15); }

    /* ── ENTRY POINT BREADCRUMB ── */
    #ep-breadcrumb {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      display: none; align-items: center; gap: 6px;
      background: var(--overlay-bg); border: 1px solid var(--border);
      border-radius: 20px; padding: 5px 14px; font-size: 12px;
      pointer-events: none; z-index: 10; white-space: nowrap;
      backdrop-filter: blur(4px);
    }
    #ep-breadcrumb.visible { display: flex; }
    .bc-method { font-weight: 700; font-size: 11px; }
    .bc-fw     { font-size: 10px; color: #a78bfa; }
    .bc-path   { font-family: 'SF Mono','Fira Code',monospace; color: var(--text); }
    .bc-sep    { color: var(--dim); }

    /* ── DETAIL PANEL ── */
    #detail-panel {
      width: 350px; background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow: hidden; flex-shrink: 0;
      transition: width .15s;
    }
    #detail-panel.closed { width: 0; border-left: none; }
    #detail-header {
      padding: 10px 14px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    #detail-header h3 { font-size: 13px; font-weight: 600; }
    #detail-close {
      background: none; border: none; color: var(--muted);
      cursor: pointer; font-size: 20px; line-height: 1; padding: 0 4px;
    }
    #detail-close:hover { color: var(--text); }
    #detail-body { flex: 1; overflow-y: auto; padding: 14px; }
    .ds { margin-bottom: 14px; }
    .ds h4 { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .7px; color: var(--dim); margin-bottom: 6px; }
    .badge { display: inline-flex; align-items: center; gap: 3px; padding: 2px 7px; border-radius: 4px; font-size: 11px; font-weight: 500; }
    .b-cat { color: #fff; }
    .b-db    { background: rgba(4,120,87,.2); color: #34d399; border: 1px solid rgba(4,120,87,.35); }
    .b-http  { background: rgba(180,83,9,.2); color: #fbbf24; border: 1px solid rgba(180,83,9,.35); }
    .b-kafka { background: rgba(185,28,28,.2); color: #f87171; border: 1px solid rgba(185,28,28,.35); }
    .b-tx    { background: rgba(124,58,237,.2); color: #c4b5fd; border: 1px solid rgba(124,58,237,.35); }
    .b-redis { background: rgba(239,68,68,.2); color: #fca5a5; border: 1px solid rgba(239,68,68,.35); }
    .b-sync  { background: rgba(14,165,233,.2); color: #7dd3fc; border: 1px solid rgba(14,165,233,.35); }
    .b-chan  { background: rgba(124,58,237,.2); color: #a78bfa; border: 1px solid rgba(124,58,237,.35); }
    .b-ok    { background: rgba(4,120,87,.2); color: #34d399; border: 1px solid rgba(4,120,87,.35); }
    .b-warn  { background: rgba(185,28,28,.2); color: #f87171; border: 1px solid rgba(185,28,28,.35); }
    .meta-row { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
    .file-ref {
      font-family: 'SF Mono','Fira Code',monospace; font-size: 11px;
      color: var(--muted); background: var(--surface2);
      border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px;
      word-break: break-all;
    }
    .detail-item {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 5px; padding: 7px 10px; margin-bottom: 4px; font-size: 12px;
    }
    .detail-item .method { font-weight: 600; color: #34d399; }
    .detail-item .query  { font-family: monospace; font-size: 10px; color: var(--muted); margin-top: 3px; word-break: break-all; }
    .source-pre {
      font-family: 'SF Mono','Fira Code','Consolas',monospace; font-size: 11px;
      line-height: 1.65; background: var(--source-bg); border: 1px solid var(--border);
      border-radius: 6px; padding: 12px; overflow: auto; color: var(--source-text);
      white-space: pre; max-height: 600px;
    }
    /* Go syntax highlight — dark theme (GitHub dark) */
    .go-kw      { color: #ff7b72; }
    .go-type    { color: #ffa657; }
    .go-fn      { color: #d2a8ff; }
    .go-builtin { color: #ffa657; }
    .go-const   { color: #79c0ff; }
    .go-string  { color: #a5d6ff; }
    .go-comment { color: #8b949e; font-style: italic; }
    .go-number  { color: #79c0ff; }
    /* Go syntax highlight — light theme (GitHub light) */
    [data-theme="light"] .go-kw      { color: #cf222e; }
    [data-theme="light"] .go-type    { color: #953800; }
    [data-theme="light"] .go-fn      { color: #8250df; }
    [data-theme="light"] .go-builtin { color: #953800; }
    [data-theme="light"] .go-const   { color: #0550ae; }
    [data-theme="light"] .go-string  { color: #0a3069; }
    [data-theme="light"] .go-comment { color: #6e7781; font-style: italic; }
    [data-theme="light"] .go-number  { color: #0550ae; }

    /* ── RESIZE HANDLE ── */
    #resize-handle {
      width: 4px; background: var(--border); cursor: col-resize;
      flex-shrink: 0; display: none; transition: background .15s;
    }
    #resize-handle:hover, #resize-handle.active { background: #7c3aed; }
    #detail-panel.resizing { transition: none !important; }
    /* EP info row in detail panel */
    .ep-route-row {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 5px; padding: 7px 10px;
    }
    .ep-route-row .epr-path {
      font-family: 'SF Mono','Fira Code',monospace; font-size: 11px;
      color: var(--text); word-break: break-all;
    }

    /* ── CONFLICTS BAR ── */
    #cbar { background: var(--surface); border-top: 1px solid var(--border); flex-shrink: 0; }
    #ctoggle {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 16px; cursor: pointer; user-select: none;
      font-size: 12px; font-weight: 600; color: #f87171;
    }
    #ctoggle:hover { background: rgba(239,68,68,.05); }
    #ccontent { padding: 0 16px 12px; display: flex; gap: 10px; flex-wrap: wrap; }
    #ccontent.closed { display: none; }
    .ccard {
      background: rgba(239,68,68,.07); border: 1px solid rgba(239,68,68,.25);
      border-radius: 6px; padding: 9px 12px; font-size: 12px; min-width: 180px;
    }
    .ccard-res { font-family: monospace; font-weight: 700; color: #f87171; margin-bottom: 5px; }
    .ccard-ep  { color: var(--muted); font-size: 11px; margin-bottom: 2px; }
    .ccard-prot { margin-top: 7px; font-size: 11px; font-weight: 600; }
    .prot-none { color: #f87171; }
    .prot-ok   { color: #34d399; }

    /* ── UPLOAD SCREEN ── */
    #upload {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; align-items: center; justify-content: center; z-index: 200;
    }
    #upload.gone { display: none; }
    .ucard {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 40px; width: 540px;
    }
    .ucard .logo-big { font-size: 28px; font-weight: 800; color: #a78bfa; margin-bottom: 4px; display: flex; align-items: center; gap: 12px; }
    .logo-img-big { height: 48px; width: auto; display: block; }
    .ucard .tagline  { color: var(--muted); font-size: 13px; margin-bottom: 28px; }
    .dropzone {
      border: 2px dashed var(--border); border-radius: 8px;
      padding: 28px; text-align: center; cursor: pointer; margin-bottom: 12px;
      transition: border-color .15s, background .15s;
    }
    .dropzone:hover, .dropzone.over { border-color: #7c3aed; background: rgba(124,58,237,.05); }
    .dropzone p    { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
    .dropzone span { color: var(--dim); font-size: 11px; }
    #uerr { color: #f87171; font-size: 12px; margin-top: 10px; min-height: 18px; }

    /* ── EMPTY STATE ── */
    #empty {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--dim); pointer-events: none;
    }
    #empty .ei { font-size: 44px; margin-bottom: 12px; opacity: .4; }
    #empty p   { font-size: 13px; }

    /* ── LEGEND ── */
    #legend {
      position: absolute; bottom: 16px; left: 16px;
      background: var(--overlay-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 14px;
      display: flex; gap: 12px; flex-wrap: wrap; pointer-events: none;
    }
    .leg { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
    .leg-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── THEME TOGGLE ── */
    #btn-theme {
      background: none; border: 1px solid var(--border);
      color: var(--muted); padding: 4px 9px; border-radius: 5px;
      cursor: pointer; font-size: 14px; line-height: 1;
      transition: border-color .12s, color .12s, background .12s;
    }
    #btn-theme:hover { border-color: var(--muted); color: var(--text); }

    /* ── SIDEBAR COLLAPSE ── */
    #sidebar { transition: width .2s ease; }
    #sidebar.sb-collapsed { width: 0 !important; border-right: none; overflow: hidden; }
    #sidebar-reopen {
      position: absolute; top: 10px; left: 0; z-index: 20;
      background: var(--surface); border: 1px solid var(--border);
      border-left: none; border-radius: 0 5px 5px 0;
      color: var(--muted); padding: 6px 8px; cursor: pointer;
      font-size: 13px; display: none; transition: color .12s, background .12s;
    }
    #sidebar-reopen:hover { color: var(--text); background: var(--surface2); }
    #sidebar-reopen.visible { display: block; }
  </style>
</head>
<body>

<!-- ══ UPLOAD SCREEN ══ -->
<div id="upload">
  <div class="ucard">
    <div class="logo-big"><img src="../assets/logo.png" class="logo-img-big" alt="">Sauron Eye</div>
    <div class="tagline">Call Graph Visualizer — upload a <code>callgraph.json</code></div>
    <div class="dropzone" id="dropzone">
      <p>Drop <code>callgraph.json</code> here</p>
      <span>or click to browse</span>
      <input type="file" id="file-in" accept=".json" style="display:none">
    </div>
    <div id="uerr"></div>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="topbar" style="display:none">
  <button class="btn-back" id="btn-load" title="Back to main page">←</button>
  <div class="logo"><img src="../assets/logo.png" class="logo-img" alt="">Sauron Eye <span id="svc-name"></span></div>
  <div class="chip">entries <b id="st-ep">0</b></div>
  <div class="chip">db_calls <b id="st-db">0</b></div>
  <div class="chip" id="st-conf-chip">conflicts <b id="st-conf">0</b></div>
  <div id="topbar-spacer"></div>
  <div id="pkg-filter-wrap" title="Only show nodes whose package path starts with this prefix">
    <label>pkg</label>
    <input id="pkg-filter-input" type="text" placeholder="e.g. mymodule/internal" spellcheck="false">
  </div>
  <button id="btn-theme" title="Toggle light/dark mode">☀</button>
</div>

<div id="layout" style="display:none">
  <div id="sidebar">
    <div id="sidebar-title">Entry Points
      <div style="display:flex;gap:4px">
        <button class="sidebar-toggle-btn" id="btn-hide-stdlib">hide stdlib</button>
        <button class="sidebar-toggle-btn" id="btn-hide-generated">hide gen</button>
        <button class="sidebar-toggle-btn" id="btn-sidebar-collapse" title="Collapse sidebar">◀</button>
      </div>
    </div>
    <div id="ep-search-wrap">
      <input id="ep-search" type="text" placeholder="Filter by path or name…" spellcheck="false" autocomplete="off">
    </div>
    <div id="ep-list"></div>
  </div>

  <div id="tree-area">
    <button id="sidebar-reopen" title="Open sidebar">▶</button>
    <div id="empty">
      <div class="ei">🌳</div>
      <p>Select an entry point from the sidebar</p>
    </div>
    <!-- Breadcrumb: shows selected entry point context -->
    <div id="ep-breadcrumb">
      <span class="bc-fw" id="bc-fw"></span>
      <span class="bc-method" id="bc-method"></span>
      <span class="bc-path" id="bc-path"></span>
      <span class="bc-sep">→</span>
      <span style="color:var(--muted);font-size:11px" id="bc-fn"></span>
    </div>
    <svg id="tree-svg">
      <g id="tc"></g>
    </svg>
    <div id="legend">
      <div class="leg"><div class="leg-dot" style="background:#7c3aed"></div>handler</div>
      <div class="leg"><div class="leg-dot" style="background:#1d4ed8"></div>service</div>
      <div class="leg"><div class="leg-dot" style="background:#047857"></div>repository</div>
      <div class="leg"><div class="leg-dot" style="background:#b45309"></div>http_client</div>
      <div class="leg"><div class="leg-dot" style="background:#b91c1c"></div>producer</div>
      <div class="leg"><div class="leg-dot" style="background:#374151"></div>unknown</div>
      <div class="leg">
        <svg width="18" height="8"><line x1="0" y1="4" x2="18" y2="4" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5,2"/></svg>
        channel
      </div>
      <div class="leg">
        <svg width="18" height="8"><line x1="0" y1="4" x2="18" y2="4" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3,3"/></svg>
        defer
      </div>
      <div class="leg">
        <svg width="18" height="8"><rect x="0" y="0" width="18" height="8" rx="2" fill="none" stroke="#14b8a6" stroke-width="1" stroke-dasharray="4,2"/></svg>
        generated

  <div id="resize-handle"></div>

</div>

<div id="cbar" style="display:none">
  <div id="ctoggle">
    <span>⚠</span><span id="clabel"></span><span id="cchev">▲</span>
  </div>
  <div id="ccontent"></div>
</div>

<script>
// ════════════════════════════════════════════════════════
//  CONSTANTS & HELPERS
// ════════════════════════════════════════════════════════
const NW = 216, NH = 78, NRX = 7;     // node width, height, corner radius
const HGAP = 56, VGAP = 14;           // gaps between nodes

const CAT_COLOR = {
  handler:     '#7c3aed',
  service:     '#1d4ed8',
  repository:  '#047857',
  http_client: '#b45309',
  producer:    '#b91c1c',
  unknown:     '#374151',
};

// HTTP method → display color (matches .m-* CSS classes)
const METHOD_COLOR = {
  GET:     '#22c55e',
  POST:    '#3b82f6',
  PUT:     '#f59e0b',
  DELETE:  '#ef4444',
  PATCH:   '#a855f7',
  HEAD:    '#8b949e',
  OPTIONS: '#8b949e',
  ANY:     '#60a5fa',
};

function methodColor(m) { return METHOD_COLOR[m] || METHOD_COLOR.ANY; }
function methodClass(m) { return 'm-' + (METHOD_COLOR[m] ? m : 'other'); }

function shortName(fn) {
  if (!fn) return '?';
  let s = fn.split('.').pop() || fn;
  s = s.replace(/\$bound$/, '').replace(/\$\d+$/, '');
  const m = s.match(/\)\.(.+)$/);
  return m ? m[1] : s;
}

function shortFile(f, l) {
  if (!f) return '';
  const n = f.split('/').pop();
  return l ? `${n}:${l}` : n;
}

function countMeta(n) {
  if (!n) return {};
  const chOps = n.channel_ops || [];
  return {
    db:       (n.db_calls    || []).length,
    http:     (n.http_calls  || []).length,
    kafka:    (n.kafka_ops   || []).length,
    tx:       (n.tx_ops      || []).length,
    redis:    (n.redis_ops   || []).length,
    sync:     (n.sync_ops    || []).length,
    chanSend: chOps.filter(o => o.direction === 'send').length,
    chanRecv: chOps.filter(o => o.direction === 'receive').length,
  };
}

function totalDbCalls(root) {
  let n = 0;
  function walk(node) {
    if (!node) return;
    n += (node.db_calls || []).length;
    (node.children || []).forEach(e => walk(e.callee));
  }
  walk(root);
  return n;
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Go syntax highlighter ────────────────────────────────
function highlightGo(code) {
  const KW = new Set(['break','case','chan','const','continue','default','defer',
    'else','fallthrough','for','func','go','goto','if','import','interface','map',
    'package','range','return','select','struct','switch','type','var']);
  const TYPES = new Set(['bool','byte','complex64','complex128','error',
    'float32','float64','int','int8','int16','int32','int64','rune','string',
    'uint','uint8','uint16','uint32','uint64','uintptr','any','comparable']);
  const BUILTINS = new Set(['append','cap','close','complex','copy','delete',
    'imag','len','make','new','panic','print','println','real','recover','min','max','clear']);
  const CONSTS = new Set(['true','false','nil','iota']);

  let i = 0, out = '';
  const n = code.length;
  const sp = (cls, txt) => `<span class="go-${cls}">${escHtml(txt)}</span>`;

  while (i < n) {
    // Line comment
    if (code[i] === '/' && code[i+1] === '/') {
      const s = i; while (i < n && code[i] !== '\n') i++;
      out += sp('comment', code.slice(s, i)); continue;
    }
    // Block comment
    if (code[i] === '/' && code[i+1] === '*') {
      const s = i; i += 2;
      while (i < n && !(code[i-1] === '*' && code[i] === '/')) i++;
      if (i < n) i++;
      out += sp('comment', code.slice(s, i)); continue;
    }
    // Raw string
    if (code[i] === '`') {
      const s = i++; while (i < n && code[i] !== '`') i++;
      if (i < n) i++;
      out += sp('string', code.slice(s, i)); continue;
    }
    // Interpreted string
    if (code[i] === '"') {
      const s = i++;
      while (i < n && code[i] !== '"' && code[i] !== '\n') {
        if (code[i] === '\\') i++; i++;
      }
      if (i < n && code[i] === '"') i++;
      out += sp('string', code.slice(s, i)); continue;
    }
    // Rune literal
    if (code[i] === "'") {
      const s = i++;
      while (i < n && code[i] !== "'" && code[i] !== '\n') {
        if (code[i] === '\\') i++; i++;
      }
      if (i < n && code[i] === "'") i++;
      out += sp('string', code.slice(s, i)); continue;
    }
    // Number
    if (/[0-9]/.test(code[i])) {
      const s = i;
      while (i < n && /[0-9a-fA-FxXoObBpPeE._]/.test(code[i])) i++;
      out += sp('number', code.slice(s, i)); continue;
    }
    // Identifier / keyword
    if (/[a-zA-Z_]/.test(code[i])) {
      const s = i;
      while (i < n && /[a-zA-Z0-9_]/.test(code[i])) i++;
      const w = code.slice(s, i);
      // peek past whitespace for next char
      let j = i; while (j < n && (code[j] === ' ' || code[j] === '\t')) j++;
      const next = j < n ? code[j] : '';
      if      (KW.has(w))      out += sp('kw',      w);
      else if (TYPES.has(w))   out += sp('type',    w);
      else if (CONSTS.has(w))  out += sp('const',   w);
      else if (BUILTINS.has(w))out += sp('builtin', w);
      else if (next === '(')   out += sp('fn',      w);
      else if (/^[A-Z]/.test(w)) out += sp('type',  w);
      else                     out += escHtml(w);
      continue;
    }
    // Everything else (operators, punctuation, whitespace)
    out += escHtml(code[i]); i++;
  }
  return out;
}

// Use framework field when present; fall back to path heuristics for older JSON.
function isStdlib(ep) {
  if (ep.framework === 'stdlib') return true;
  if (ep.framework && ep.framework !== '') return false;
  // Fallback for JSON without framework field
  const fn = ep.function_name || '';
  const f  = ep.file || '';
  return fn.startsWith('expvar') || fn.startsWith('golang.org') ||
         fn.startsWith('net/http/pprof') ||
         f.includes('/go/pkg/mod/') || f.includes('/usr/local/go/');
}

// ════════════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════════════
let DATA = null;
let conflictsOpen = true;
let zoomBehavior = null;
let pkgFilter = '';   // package path prefix; empty = show all

// ════════════════════════════════════════════════════════
//  UPLOAD
// ════════════════════════════════════════════════════════
function tryLoad(text) {
  try {
    const data = JSON.parse(text.trim());
    if (!data.graphs) throw new Error('Missing "graphs" key — is this a sauron-eye callgraph.json?');
    DATA = data;
    document.getElementById('uerr').textContent = '';
    initApp();
  } catch(e) { showErr(e.message); }
}
function showErr(msg) { document.getElementById('uerr').textContent = '⚠ ' + msg; }

const dz = document.getElementById('dropzone');
dz.addEventListener('click', () => document.getElementById('file-in').click());
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('over'));
dz.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('over');
  const f = e.dataTransfer.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = ev => tryLoad(ev.target.result); r.readAsText(f);
});
document.getElementById('file-in').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = ev => tryLoad(ev.target.result); r.readAsText(f);
});
document.getElementById('btn-hide-stdlib').addEventListener('click', function() {
  this.classList.toggle('active');
  document.getElementById('ep-list').classList.toggle('hide-stdlib');
});

let hideGenerated = false;
document.getElementById('btn-hide-generated').addEventListener('click', function() {
  hideGenerated = !hideGenerated;
  this.classList.toggle('active', hideGenerated);
  if (_activeGraphIdx !== null) renderTree(DATA.graphs[_activeGraphIdx]);
});

document.getElementById('btn-load').addEventListener('click', () => {
  document.getElementById('upload').classList.remove('gone');
  // Reset file input so the same file can be re-selected
  document.getElementById('file-in').value = '';
  document.getElementById('uerr').textContent = '';
  clearTree();
});

// ── Sidebar search ──────────────────────────────────────
document.getElementById('ep-search').addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();
  document.querySelectorAll('.ep-item').forEach(el => {
    if (!q) { el.classList.remove('hidden'); return; }
    const text = (el.dataset.search || '').toLowerCase();
    el.classList.toggle('hidden', !text.includes(q));
  });
  // Hide groups when all their items are hidden
  document.querySelectorAll('.ep-group').forEach(group => {
    const anyVisible = [...group.querySelectorAll('.ep-item')].some(el => !el.classList.contains('hidden'));
    group.style.display = anyVisible ? '' : 'none';
  });
});

// ════════════════════════════════════════════════════════
//  INIT APP
// ════════════════════════════════════════════════════════
function initApp() {
  document.getElementById('upload').classList.add('gone');
  document.getElementById('topbar').style.display = 'flex';
  document.getElementById('layout').style.display = 'flex';

  const graphs = DATA.graphs || [];
  const conflicts = DATA.conflicts || [];

  // Stats
  let totalDb = 0;
  graphs.forEach(g => { totalDb += totalDbCalls(g.root); });
  document.getElementById('st-ep').textContent   = graphs.length;
  document.getElementById('st-db').textContent   = totalDb;
  document.getElementById('st-conf').textContent = conflicts.length;
  if (conflicts.length > 0) document.getElementById('st-conf-chip').classList.add('err');

  // Service name
  for (const g of graphs) {
    const fn = g.entry_point?.function_name || '';
    if (!isStdlib(g.entry_point) && fn.includes('/')) {
      const parts = fn.split('/');
      if (parts.length >= 2) { document.getElementById('svc-name').textContent = '/ ' + parts[1]; break; }
    }
  }

  // Pre-fill pkg filter from module name embedded in JSON
  if (DATA.module) {
    pkgFilter = DATA.module;
    document.getElementById('pkg-filter-input').value = DATA.module;
  }

  buildSidebar(graphs);
  buildConflicts(conflicts);
}

// Re-render current tree when filter changes
let _activeGraphIdx = null;
document.getElementById('pkg-filter-input').addEventListener('input', function() {
  pkgFilter = this.value.trim();
  if (_activeGraphIdx !== null) renderTree(DATA.graphs[_activeGraphIdx]);
});

// ════════════════════════════════════════════════════════
//  SIDEBAR
// ════════════════════════════════════════════════════════
function buildSidebar(graphs) {
  const list = document.getElementById('ep-list');
  list.innerHTML = '';

  const groups = { http: [], kafka: [], grpc: [], cron: [], other: [] };
  graphs.forEach((g, i) => {
    const src = g.entry_point?.source || 'other';
    (groups[src] || groups.other).push({ g, i });
  });

  const labels = { http: 'HTTP', kafka: 'Kafka', grpc: 'gRPC', cron: 'Cron', other: 'Other' };
  const icons  = { http: '🌐', kafka: '📨', grpc: '⚙', cron: '🕐', other: '◦' };

  for (const [src, items] of Object.entries(groups)) {
    if (!items.length) continue;
    const allStdlib = items.every(({ g }) => isStdlib(g.entry_point));

    const groupEl = document.createElement('div');
    groupEl.className = 'ep-group';

    const lbl = document.createElement('div');
    lbl.className = 'group-label' + (allStdlib ? ' stdlib-only' : '');
    lbl.innerHTML = `<span>${labels[src]} <span style="opacity:.55">(${items.length})</span></span><span class="group-arrow">▾</span>`;

    const itemsWrap = document.createElement('div');
    itemsWrap.className = 'group-items';
    items.forEach(({ g, i }) => itemsWrap.appendChild(makeEpItem(g, i, icons[src])));

    lbl.addEventListener('click', () => {
      const collapsed = itemsWrap.classList.toggle('grp-collapsed');
      lbl.classList.toggle('grp-collapsed', collapsed);
    });

    groupEl.appendChild(lbl);
    groupEl.appendChild(itemsWrap);
    list.appendChild(groupEl);
  }
}

function makeEpItem(g, idx, icon) {
  const ep     = g.entry_point;
  const stdlib = isStdlib(ep);
  const el     = document.createElement('div');
  el.className = 'ep-item' + (stdlib ? ' stdlib' : '');
  el.dataset.idx = idx;

  const path   = ep.path || ep.topic || shortName(ep.function_name);
  const method = ep.method && ep.method !== 'ANY'
    ? ep.method
    : (ep.source || '').toUpperCase();
  const fn     = shortName(ep.function_name);
  const fw     = ep.framework || '';

  // data-search covers path, method, fn name and framework for the search filter
  el.dataset.search = [path, method, fn, fw].join(' ');

  const fwBadge = fw
    ? `<span class="fw-badge fw-${escHtml(fw)}">${escHtml(fw)}</span>`
    : '';

  el.innerHTML = `
    <div class="ep-icon">${icon}</div>
    <div class="ep-info">
      <div class="ep-top">
        <span class="ep-method ${methodClass(method)}">${escHtml(method)}</span>
        ${fwBadge}
      </div>
      <div class="ep-path" title="${escHtml(path)}">${escHtml(path || fn)}</div>
      <div class="ep-fn">${escHtml(fn)}</div>
    </div>`;

  el.addEventListener('click', () => {
    document.querySelectorAll('.ep-item').forEach(e => e.classList.remove('active'));
    el.classList.add('active');
    _activeGraphIdx = idx;
    renderTree(DATA.graphs[idx]);
  });
  return el;
}

// ════════════════════════════════════════════════════════
//  BREADCRUMB
// ════════════════════════════════════════════════════════
function showBreadcrumb(ep) {
  const bc = document.getElementById('ep-breadcrumb');
  const method = ep.method || ep.source || '';
  document.getElementById('bc-fw').textContent     = ep.framework ? ep.framework : '';
  document.getElementById('bc-method').textContent = method;
  document.getElementById('bc-method').style.color = methodColor(method);
  document.getElementById('bc-path').textContent   = ep.path || ep.topic || '';
  document.getElementById('bc-fn').textContent     = shortName(ep.function_name);
  bc.classList.add('visible');
}

// ════════════════════════════════════════════════════════
//  TREE — D3
// ════════════════════════════════════════════════════════

// Convert CallNode → plain object for d3.hierarchy.
// _via / _deferred are set on each child from the incoming edge attributes.
function toH(callNode, via, deferred) {
  if (!callNode) return null;
  const kids = [];
  for (const edge of (callNode.children || [])) {
    if (!edge.callee) continue;
    const childVia      = edge.via      || '';
    const childDeferred = !!edge.deferred;
    // Package filter: skip nodes whose package doesn't match the prefix (if filter is set)
    const childPkg = edge.callee.package || '';
    if (pkgFilter && childPkg && !childPkg.startsWith(pkgFilter)) continue;
    // Generated filter: when toggle is active, collapse generated nodes into
    // a stub leaf (still visible as a boundary, but subtree not expanded).
    if (hideGenerated && edge.callee.generated) {
      kids.push({ _trunc: true, _gen: true, _n: edge.callee, _via: childVia, _deferred: childDeferred });
      continue;
    }
    if (edge.callee.truncated) {
      kids.push({ _trunc: true, _n: edge.callee, _via: childVia, _deferred: childDeferred });
    } else {
      const c = toH(edge.callee, childVia, childDeferred);
      if (c) kids.push(c);
    }
  }
  return { _n: callNode, _kids: kids, _via: via || '', _deferred: !!deferred };
}

// Conflict function names for highlight
function conflictFnSet() {
  const s = new Set();
  (DATA.conflicts || []).forEach(c => c.entry_points.forEach(ep => s.add(ep.function_name)));
  return s;
}

function clearTree() {
  document.getElementById('tc').innerHTML = '';
  document.getElementById('empty').style.display = 'flex';
  document.getElementById('empty').innerHTML = '<div class="ei">🌳</div><p>Select an entry point from the sidebar</p>';
  document.getElementById('ep-breadcrumb').classList.remove('visible');
  closeDetail();
}

function renderTree(graph) {
  document.getElementById('empty').style.display = 'none';
  const tc = document.getElementById('tc');
  tc.innerHTML = '';

  showBreadcrumb(graph.entry_point);

  if (!graph.root) {
    document.getElementById('empty').style.display = 'flex';
    document.getElementById('empty').innerHTML = '<div class="ei">⚠</div><p>No call tree for this entry point</p>';
    return;
  }

  const hierRaw = toH(graph.root);
  const root = d3.hierarchy(hierRaw, d => d._kids?.length ? d._kids : null);

  const layout = d3.tree().nodeSize([NH + VGAP, NW + HGAP]);
  layout(root);

  // Rotate: swap x/y for left→right layout
  root.each(d => { const t = d.x; d.x = d.y; d.y = t; });

  const svg = d3.select('#tree-svg');
  const g   = d3.select('#tc');

  // Zoom
  if (!zoomBehavior) {
    zoomBehavior = d3.zoom().scaleExtent([0.05, 4])
      .on('zoom', ev => g.attr('transform', ev.transform));
    svg.call(zoomBehavior);
  }

  const conflictFns = conflictFnSet();

  // Links — channel edges: dashed purple; deferred edges: dashed amber
  g.selectAll('.link').data(root.links()).join('path')
    .attr('class', lnk => {
      if (lnk.target.data._via === 'channel') return 'link link-channel';
      if (lnk.target.data._deferred)          return 'link link-deferred';
      return 'link';
    })
    .attr('d', lnk => {
      const sx = lnk.source.x + NW, sy = lnk.source.y + NH / 2;
      const tx = lnk.target.x,      ty = lnk.target.y + NH / 2;
      const mx = (sx + tx) / 2;
      return `M${sx},${sy} C${mx},${sy} ${mx},${ty} ${tx},${ty}`;
    });

  // Nodes
  const node = g.selectAll('.node-g').data(root.descendants()).join('g')
    .attr('class', 'node-g')
    .attr('transform', d => `translate(${d.x},${d.y})`)
    .on('click', (ev, d) => {
      ev.stopPropagation();
      d3.selectAll('.node-g').classed('selected', false);
      d3.select(ev.currentTarget).classed('selected', true);
      if (!d.data._trunc && d.data._n) showDetail(d.data._n, graph.entry_point);
    });

  // Background rect
  node.append('rect')
    .attr('class', 'node-bg')
    .attr('width', NW).attr('height', NH).attr('rx', NRX)
    .attr('fill', d => {
      if (d.data._trunc) return d.data._gen ? 'rgba(20,184,166,.08)' : '#1a2030';
      const cat = d.data._n?.category || 'unknown';
      return (CAT_COLOR[cat] || CAT_COLOR.unknown) + '28';
    })
    .attr('stroke', d => {
      if (d.data._gen)  return '#14b8a6';
      if (d.data._trunc) return '#21262d';
      const fn = d.data._n?.function_name;
      if (fn && conflictFns.has(fn)) return '#ef4444';
      if (d.data._n?.generated) return '#14b8a6';
      const cat = d.data._n?.category || 'unknown';
      return (CAT_COLOR[cat] || CAT_COLOR.unknown) + '80';
    })
    .attr('stroke-width', d => {
      if (d.data._n?.function_name && conflictFns.has(d.data._n.function_name)) return 1.5;
      return 1;
    })
    .attr('stroke-dasharray', d => (d.data._gen || d.data._n?.generated) ? '5,3' : null);

  // Category accent bar (left edge)
  node.filter(d => !d.data._trunc && d.data._n)
    .append('rect')
    .attr('width', 3).attr('height', NH).attr('rx', 1.5)
    .attr('fill', d => CAT_COLOR[d.data._n.category || 'unknown'] || CAT_COLOR.unknown);

  // "defer" tag — top-right corner of nodes reached via defer
  node.filter(d => !d.data._trunc && d.data._deferred)
    .append('rect')
    .attr('x', NW - 40).attr('y', 4).attr('width', 36).attr('height', 14).attr('rx', 3)
    .attr('fill', 'rgba(217,119,6,.25)').attr('stroke', '#d97706').attr('stroke-width', 0.5);
  node.filter(d => !d.data._trunc && d.data._deferred)
    .append('text')
    .attr('x', NW - 22).attr('y', 14).attr('text-anchor', 'middle')
    .attr('fill', '#fbbf24').attr('font-size', 9).attr('font-weight', 600)
    .attr('font-family', '-apple-system,sans-serif')
    .text('defer');

  // Function name
  const cs = getComputedStyle(document.documentElement);
  const nodeTextColor = cs.getPropertyValue('--node-text').trim() || '#e6edf3';
  const nodeDimColor  = cs.getPropertyValue('--node-dim-text').trim() || '#484f58';

  node.filter(d => !d.data._trunc && d.data._n)
    .append('text')
    .attr('x', 12).attr('y', 22)
    .attr('fill', nodeTextColor).attr('font-size', 12).attr('font-weight', 600)
    .attr('font-family', '-apple-system, BlinkMacSystemFont, sans-serif')
    .text(d => { const s = shortName(d.data._n.function_name); return s.length > 23 ? s.slice(0,21)+'…' : s; });

  // File:line
  node.filter(d => !d.data._trunc && d.data._n)
    .append('text')
    .attr('x', 12).attr('y', 36)
    .attr('fill', nodeDimColor).attr('font-size', 10).attr('font-family', 'monospace')
    .text(d => shortFile(d.data._n.file, d.data._n.line));

  // Meta badges (inline SVG micro-badges)
  node.filter(d => !d.data._trunc && d.data._n)
    .each(function(d) {
      const meta = countMeta(d.data._n);
      const el   = d3.select(this);
      let bx = 10, by = 60;

      function addBadge(label, fg, bg) {
        const w = label.length * 6.5 + 10;
        el.append('rect').attr('x',bx).attr('y',by-11).attr('width',w).attr('height',14)
          .attr('rx',3).attr('fill',bg).attr('stroke',fg).attr('stroke-width',0.5).attr('opacity',.8);
        el.append('text').attr('x',bx+5).attr('y',by).attr('fill',fg)
          .attr('font-size',9).attr('font-weight',600)
          .attr('font-family','-apple-system,sans-serif').text(label);
        bx += w + 5;
      }

      if (d.data._n.generated)  addBadge('gen',              '#5eead4', 'rgba(20,184,166,.18)');
      if (meta.db       > 0) addBadge(`⬡ ${meta.db} db`,  '#34d399', 'rgba(4,120,87,.25)');
      if (meta.http     > 0) addBadge(`↗ http`,            '#fbbf24', 'rgba(180,83,9,.25)');
      if (meta.kafka    > 0) addBadge(`⟳ kafka`,           '#f87171', 'rgba(185,28,28,.25)');
      if (meta.tx       > 0) addBadge(`tx`,                '#c4b5fd', 'rgba(124,58,237,.25)');
      if (meta.chanSend > 0) addBadge(`→ chan`,             '#a78bfa', 'rgba(124,58,237,.25)');
      if (meta.chanRecv > 0) addBadge(`← chan`,             '#a78bfa', 'rgba(124,58,237,.25)');
    });

  // Truncated node — distinguish: gen stub vs cycle vs depth cutoff
  node.filter(d => !!d.data._trunc)
    .attr('opacity', d => d.data._gen ? 0.75 : 1);

  node.filter(d => !!d.data._trunc)
    .append('text')
    .attr('x', NW/2).attr('y', NH/2 - 4)
    .attr('text-anchor', 'middle')
    .attr('font-size', 11)
    .attr('fill', d => {
      if (d.data._gen) return '#5eead4';
      return d.data._n?.trunc_reason === 'cycle' ? '#f87171' : '#484f58';
    })
    .text(d => {
      const fn = d.data._n?.function_name;
      return fn ? shortName(fn) : '…';
    });
  node.filter(d => !!d.data._trunc)
    .append('text')
    .attr('x', NW/2).attr('y', NH/2 + 10)
    .attr('text-anchor', 'middle')
    .attr('font-size', 10)
    .attr('fill', d => {
      if (d.data._gen) return '#0d9488';
      return d.data._n?.trunc_reason === 'cycle' ? '#7f1d1d' : '#374151';
    })
    .text(d => {
      if (d.data._gen) return '⬡ generated';
      const reason = d.data._n?.trunc_reason;
      if (reason === 'cycle') return '↻ cycle';
      if (reason === 'depth') return '… max depth';
      return d.data._n?.function_name ? '↻ cycle' : '… max depth';
    });

  // Click on canvas background → deselect
  svg.on('click', () => {
    d3.selectAll('.node-g').classed('selected', false);
    closeDetail();
  });

  // Auto-fit
  requestAnimationFrame(() => {
    const box  = document.getElementById('tc').getBBox();
    const svgEl = document.getElementById('tree-svg');
    const W = svgEl.clientWidth, H = svgEl.clientHeight;
    const pad = 60;
    const scale = Math.min((W - pad*2) / Math.max(box.width,1), (H - pad*2) / Math.max(box.height,1), 1);
    const tx = (W - box.width*scale) / 2 - box.x*scale;
    const ty = (H - box.height*scale) / 2 - box.y*scale;
    d3.select('#tree-svg').call(zoomBehavior.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
  });
}

// ════════════════════════════════════════════════════════
//  DETAIL PANEL
// ════════════════════════════════════════════════════════
function showDetail(n, entryPoint) {
  const panel = document.getElementById('detail-panel');
  panel.style.width = detailWidth + 'px';
  panel.classList.remove('closed');
  document.getElementById('resize-handle').style.display = 'block';
  const cat   = n.category || 'unknown';
  const color = CAT_COLOR[cat] || CAT_COLOR.unknown;
  const meta  = countMeta(n);

  let h = '';

  // If this is the root node (function name matches the entry point), show route info
  if (entryPoint && n.function_name === entryPoint.function_name) {
    const ep = entryPoint;
    const method = ep.method || '';
    const mcol   = methodColor(method);
    const fw     = ep.framework || '';
    const path   = ep.path || ep.topic || '';
    if (method || path || fw) {
      h += `<div class="ds"><h4>Route</h4><div class="ep-route-row">`;
      if (method) h += `<span style="font-weight:700;font-size:12px;color:${escHtml(mcol)}">${escHtml(method)}</span>`;
      if (fw)     h += `<span class="fw-badge fw-${escHtml(fw)}">${escHtml(fw)}</span>`;
      if (path)   h += `<span class="epr-path">${escHtml(path)}</span>`;
      h += `</div></div>`;
    }
  }

  // Category + location
  h += `<div class="ds">
    <div class="meta-row">
      <span class="badge b-cat" style="background:${color}33;color:${color};border:1px solid ${color}55">${cat}</span>
    </div>
    <div class="file-ref">${escHtml(n.file || '')}${n.line ? ':'+n.line : ''}</div>
  </div>`;

  // Meta badges
  const bs = [];
  if (meta.db    > 0) bs.push(`<span class="badge b-db">⬡ ${meta.db} db call${meta.db>1?'s':''}</span>`);
  if (meta.http  > 0) bs.push(`<span class="badge b-http">↗ ${meta.http} http</span>`);
  if (meta.kafka > 0) bs.push(`<span class="badge b-kafka">⟳ ${meta.kafka} kafka</span>`);
  if (meta.tx    > 0) bs.push(`<span class="badge b-tx">⊕ ${meta.tx} tx op${meta.tx>1?'s':''}</span>`);
  if (meta.redis    > 0) bs.push(`<span class="badge b-redis">◈ ${meta.redis} redis</span>`);
  if (meta.sync     > 0) bs.push(`<span class="badge b-sync">⊗ ${meta.sync} sync</span>`);
  if (meta.chanSend > 0) bs.push(`<span class="badge b-chan">→ ${meta.chanSend} chan send${meta.chanSend>1?'s':''}</span>`);
  if (meta.chanRecv > 0) bs.push(`<span class="badge b-chan">← ${meta.chanRecv} chan recv</span>`);
  if (bs.length) h += `<div class="ds"><div class="meta-row">${bs.join('')}</div></div>`;

  // DB calls
  if ((n.db_calls || []).length > 0) {
    h += `<div class="ds"><h4>DB Calls</h4>`;
    n.db_calls.forEach(c => {
      h += `<div class="detail-item">
        <span class="method">${escHtml(c.method)}</span>
        <span style="color:var(--dim);font-size:10px"> ${escHtml((c.package||'').split('/').pop())} :${c.line}</span>
        ${c.query ? `<div class="query">${escHtml(c.query)}</div>` : ''}
      </div>`;
    });
    h += `</div>`;
  }

  // TX ops
  if ((n.tx_ops || []).length > 0) {
    h += `<div class="ds"><h4>Transaction Ops</h4>`;
    n.tx_ops.forEach(op => {
      h += `<div class="detail-item">
        <span class="badge b-tx">${escHtml(op.operation)}</span>
        <span style="color:var(--dim);font-size:10px;margin-left:6px">:${op.line}</span>
      </div>`;
    });
    h += `</div>`;
  }

  // HTTP calls
  if ((n.http_calls || []).length > 0) {
    h += `<div class="ds"><h4>HTTP Calls</h4>`;
    n.http_calls.forEach(c => {
      const tb = c.has_timeout
        ? `<span class="badge b-ok">timeout ✓</span>`
        : `<span class="badge b-warn">no timeout ⚠</span>`;
      h += `<div class="detail-item"><span style="color:var(--dim);font-size:10px">:${c.line}</span> ${tb}</div>`;
    });
    h += `</div>`;
  }

  // Kafka ops
  if ((n.kafka_ops || []).length > 0) {
    h += `<div class="ds"><h4>Kafka Ops</h4>`;
    n.kafka_ops.forEach(op => {
      const inTx = op.inside_tx ? `<span class="badge b-warn" style="margin-left:4px">inside tx ⚠</span>` : '';
      h += `<div class="detail-item">
        <span class="badge b-kafka">${op.is_publish ? 'publish' : 'consume'}</span>
        ${op.topic ? `<span style="font-size:10px;color:var(--muted);margin-left:5px">${escHtml(op.topic)}</span>` : ''}
        ${inTx}
        <span style="color:var(--dim);font-size:10px;margin-left:5px">:${op.line}</span>
      </div>`;
    });
    h += `</div>`;
  }

  // Channel ops
  if ((n.channel_ops || []).length > 0) {
    h += `<div class="ds"><h4>Channel Ops</h4>`;
    n.channel_ops.forEach(op => {
      const arrow = op.direction === 'send' ? '→' : '←';
      const type  = (op.chan_type || '').split('/').pop();
      h += `<div class="detail-item">
        <span class="badge b-chan">${arrow} ${escHtml(op.direction)}</span>
        <span style="font-family:monospace;font-size:10px;color:var(--muted);margin-left:6px">${escHtml(type)}</span>
        <span style="color:var(--dim);font-size:10px;margin-left:4px">:${op.line}</span>
      </div>`;
    });
    h += `</div>`;
  }

  // Source code
  if (n.source_code) {
    h += `<div class="ds"><h4>Source Code</h4><pre class="source-pre">${highlightGo(n.source_code)}</pre></div>`;
  }

  document.getElementById('d-title').textContent = shortName(n.function_name);
  document.getElementById('detail-body').innerHTML = h;
}

function closeDetail() {
  const panel = document.getElementById('detail-panel');
  panel.style.width = '';
  panel.classList.add('closed');
  document.getElementById('resize-handle').style.display = 'none';
}
document.getElementById('detail-close').addEventListener('click', closeDetail);

// ════════════════════════════════════════════════════════
//  CONFLICTS BAR
// ════════════════════════════════════════════════════════
function buildConflicts(conflicts) {
  const bar = document.getElementById('cbar');
  if (!conflicts.length) return;
  bar.style.display = 'block';
  document.getElementById('clabel').textContent =
    `${conflicts.length} Concurrency Conflict${conflicts.length>1?'s':''} Detected`;

  const cc = document.getElementById('ccontent');
  cc.innerHTML = '';
  conflicts.forEach(c => {
    const prots = Object.entries(c.protection || {}).filter(([,v])=>v).map(([k])=>k.replace('has_','').replace(/_/g,' '));
    const card = document.createElement('div');
    card.className = 'ccard';
    card.innerHTML = `
      <div class="ccard-res">${escHtml(c.resource)}</div>
      ${c.entry_points.map(ep=>`<div class="ccard-ep">${ep.source==='http'?'🌐':'📨'} <b>${ep.source.toUpperCase()}</b> ${escHtml(ep.path || shortName(ep.function_name))}</div>`).join('')}
      <div class="ccard-prot ${prots.length?'prot-ok':'prot-none'}">
        ${prots.length ? '✓ '+prots.join(', ') : '✗ No protection detected'}
      </div>`;
    cc.appendChild(card);
  });
}

document.getElementById('ctoggle').addEventListener('click', () => {
  conflictsOpen = !conflictsOpen;
  document.getElementById('ccontent').classList.toggle('closed', !conflictsOpen);
  document.getElementById('cchev').textContent = conflictsOpen ? '▲' : '▼';
});

// ════════════════════════════════════════════════════════
//  RESIZE DETAIL PANEL
// ════════════════════════════════════════════════════════
let detailWidth = 350;
let resizing = false, resizeStartX = 0, resizeStartW = 0;
const resizeHandle = document.getElementById('resize-handle');
const detailPanel  = document.getElementById('detail-panel');

resizeHandle.addEventListener('mousedown', e => {
  resizing = true;
  resizeStartX = e.clientX;
  resizeStartW = detailPanel.offsetWidth;
  resizeHandle.classList.add('active');
  detailPanel.classList.add('resizing');
  document.body.style.userSelect = 'none';
  document.body.style.cursor = 'col-resize';
  e.preventDefault();
});

document.addEventListener('mousemove', e => {
  if (!resizing) return;
  const dx = resizeStartX - e.clientX; // drag left = wider
  detailWidth = Math.min(900, Math.max(180, resizeStartW + dx));
  detailPanel.style.width = detailWidth + 'px';
});

document.addEventListener('mouseup', () => {
  if (!resizing) return;
  resizing = false;
  resizeHandle.classList.remove('active');
  detailPanel.classList.remove('resizing');
  document.body.style.userSelect = '';
  document.body.style.cursor = '';
});

// ════════════════════════════════════════════════════════
//  THEME TOGGLE
// ════════════════════════════════════════════════════════
(function() {
  const root = document.documentElement;
  const btn  = document.getElementById('btn-theme');
  function applyTheme(t) {
    root.dataset.theme = t;
    // dark mode → show sun (click to go light); light mode → show moon (click to go dark)
    btn.textContent = t === 'dark' ? '☀' : '🌙';
    btn.title = t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
    localStorage.setItem('sauron-theme', t);
    // Re-render so SVG node text picks up new CSS var values
    if (_activeGraphIdx !== null && DATA) renderTree(DATA.graphs[_activeGraphIdx]);
  }
  const saved = localStorage.getItem('sauron-theme') || 'dark';
  applyTheme(saved);
  btn.addEventListener('click', () =>
    applyTheme(root.dataset.theme === 'dark' ? 'light' : 'dark'));
})();

// ════════════════════════════════════════════════════════
//  SIDEBAR COLLAPSE / EXPAND
// ════════════════════════════════════════════════════════
document.getElementById('btn-sidebar-collapse').addEventListener('click', () => {
  document.getElementById('sidebar').classList.add('sb-collapsed');
  document.getElementById('sidebar-reopen').classList.add('visible');
});
document.getElementById('sidebar-reopen').addEventListener('click', () => {
  document.getElementById('sidebar').classList.remove('sb-collapsed');
  document.getElementById('sidebar-reopen').classList.remove('visible');
});
</script>
